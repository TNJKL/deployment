version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis

  bookmark_service:
    image: ththi/bookmark_service:v2.0.3
    restart: always
    container_name: bookmark_service
    env_file:
      - ./bookmark_service/.env
    depends_on:
      redis:
       condition: service_started
      postgres:
       condition: service_healthy

  portal:
    image : ebvn/bookmark-app-portal:dev
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
     - "80:80"
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:Z

  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - ./bookmark_service/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bookmark" ]
      interval: 5s
      timeout: 5s
      retries: 5  
